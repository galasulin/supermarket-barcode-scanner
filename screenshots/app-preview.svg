<svg xmlns="http://www.w3.org/2000/svg" width="390" height="720" viewBox="0 0 390 720" font-family="Arial, 'Segoe UI', sans-serif">
  <rect width="390" height="720" fill="#F7F6F2"/>

  <!-- header -->
  <rect x="0" y="0" width="390" height="150" fill="#1F7A4D"/>
  <text x="366" y="38" text-anchor="end" fill="#ffffff" font-size="18" font-weight="700">סריקת ברקודים - כל החנות</text>
  <text x="366" y="74" text-anchor="end" fill="#DCEFE4" font-size="13">נסרקו 128  ·  מזוהים 121  ·  לא מזוהים 7</text>
  <text x="366" y="108" text-anchor="end" fill="#9FE1CB" font-size="14">מסונכרן ✓</text>

  <!-- scan box -->
  <rect x="16" y="166" width="230" height="52" rx="12" fill="#ffffff" stroke="#2F8F5B" stroke-width="2"/>
  <text x="30" y="198" fill="#B7BDB4" font-size="15">scan or type barcode…</text>
  <!-- camera button -->
  <rect x="254" y="166" width="58" height="52" rx="12" fill="#EAF1FB"/>
  <rect x="268" y="184" width="30" height="21" rx="4" fill="none" stroke="#1F4E84" stroke-width="2"/>
  <rect x="277" y="180" width="12" height="6" rx="2" fill="#1F4E84"/>
  <circle cx="283" cy="195" r="6" fill="none" stroke="#1F4E84" stroke-width="2"/>
  <!-- add button -->
  <rect x="320" y="166" width="54" height="52" rx="12" fill="#2F8F5B"/>
  <text x="347" y="199" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">הוסף</text>

  <!-- feedback banner (identified) -->
  <rect x="16" y="230" width="358" height="52" rx="10" fill="#E9F8EF" stroke="#BFE3CE"/>
  <text x="362" y="253" text-anchor="end" fill="#1F7A4D" font-size="15" font-weight="700">זוהה: במבה אסם 80 גרם</text>
  <text x="362" y="271" text-anchor="end" fill="#6C9A80" font-size="12">7290004131074</text>

  <!-- search -->
  <rect x="16" y="298" width="358" height="44" rx="12" fill="#ffffff" stroke="#E7E3DB"/>
  <text x="362" y="325" text-anchor="end" fill="#B7BDB4" font-size="14">חיפוש ברשימה…</text>

  <!-- row 1 identified -->
  <rect x="16" y="356" width="358" height="56" rx="12" fill="#ffffff" stroke="#BFE3CE"/>
  <text x="362" y="381" text-anchor="end" fill="#1B2A20" font-size="15" font-weight="600">במבה אסם 80 גרם</text>
  <text x="362" y="399" text-anchor="end" fill="#8C948C" font-size="12">7290004131074</text>
  <rect x="26" y="371" width="30" height="30" rx="8" fill="#FBEAEA"/>
  <text x="41" y="391" text-anchor="middle" fill="#C0392B" font-size="14">✕</text>

  <!-- row 2 identified -->
  <rect x="16" y="420" width="358" height="56" rx="12" fill="#ffffff" stroke="#BFE3CE"/>
  <text x="362" y="445" text-anchor="end" fill="#1B2A20" font-size="15" font-weight="600">קוטג' תנובה 5%</text>
  <text x="362" y="463" text-anchor="end" fill="#8C948C" font-size="12">7290000208503</text>
  <rect x="26" y="435" width="30" height="30" rx="8" fill="#FBEAEA"/>
  <text x="41" y="455" text-anchor="middle" fill="#C0392B" font-size="14">✕</text>

  <!-- row 3 unknown -->
  <rect x="16" y="484" width="358" height="56" rx="12" fill="#FFFCF4" stroke="#F3D79B"/>
  <text x="362" y="509" text-anchor="end" fill="#9A6B00" font-size="15" font-weight="600">לא מזוהה</text>
  <text x="362" y="527" text-anchor="end" fill="#B79246" font-size="12">7296789012345</text>
  <rect x="26" y="499" width="30" height="30" rx="8" fill="#FBEAEA"/>
  <text x="41" y="519" text-anchor="middle" fill="#C0392B" font-size="14">✕</text>

  <!-- row 4 identified -->
  <rect x="16" y="548" width="358" height="56" rx="12" fill="#ffffff" stroke="#BFE3CE"/>
  <text x="362" y="573" text-anchor="end" fill="#1B2A20" font-size="15" font-weight="600">אבוקדו מוכן לאכילה</text>
  <text x="362" y="591" text-anchor="end" fill="#8C948C" font-size="12">7290018732021</text>
  <rect x="26" y="563" width="30" height="30" rx="8" fill="#FBEAEA"/>
  <text x="41" y="583" text-anchor="middle" fill="#C0392B" font-size="14">✕</text>

  <!-- footer -->
  <rect x="0" y="648" width="390" height="72" fill="#ffffff" stroke="#E7E3DB"/>
  <rect x="154" y="666" width="220" height="46" rx="12" fill="#2F8F5B"/>
  <text x="264" y="695" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">ייצוא CSV</text>
  <rect x="16" y="666" width="128" height="46" rx="12" fill="#ffffff" stroke="#E7E3DB"/>
  <text x="80" y="695" text-anchor="middle" fill="#1B2A20" font-size="15">ייבוא</text>
</svg>
